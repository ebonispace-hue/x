<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS Rental</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"><style>body{background:#f8fafc}.card{border:0;border-radius:16px;box-shadow:0 4px 6px #0001}#login{position:fixed;inset:0;background:#0f172a;z-index:9;display:flex;align-items:center;justify-content:center}.thumb{width:45px;height:45px;object-fit:cover;border-radius:8px;cursor:pointer}.ro{background:#e9ecef!important;font-weight:bold}</style></head><body><div id="login"><div class="card p-4 text-white" style="width:360px;background:#ffffff12"><h4 class="text-center mb-4">Admin Login</h4><form id="lf"><label>Username</label><input id="u" class="form-control mb-3" required><label>PIN / Password</label><input id="p" type="password" class="form-control mb-3" required><button class="btn btn-primary w-100">Masuk</button></form></div></div><main id="app" class="container py-4 d-none"><div class="d-flex justify-content-between mb-4"><div><h3 class="m-0">Dashboard Rental PS</h3><small id="who" class="text-muted"></small></div><button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button></div><div class="row g-3 mb-4"><div class="col-md-4"><div class="card p-3 text-center bg-primary text-white">Omset PS A + C<h4 id="ac">Rp 0</h4></div></div><div class="col-md-4"><div class="card p-3 text-center bg-success text-white">Omset PS B<h4 id="b">Rp 0</h4></div></div><div class="col-md-4"><div class="card p-3 text-center bg-dark text-white">Total Omset<h4 id="all">Rp 0</h4></div></div></div><div class="row g-4"><div class="col-lg-4"><div class="card p-4"><h5 id="ttl">Tambah Transaksi</h5><form id="f"><input id="id" type="hidden"><label class="small">Unit PS</label><input id="unit" class="form-control ro mb-2" readonly><label class="small">Nomor Penyewa</label><input id="penyewa" class="form-control mb-2" required><div class="row"><div class="col"><label class="small">Tipe</label><select id="tipe" class="form-select mb-2"><option>Jam</option><option>Hari</option></select></div><div class="col"><label class="small">Durasi</label><input id="durasi" type="number" min="1" class="form-control mb-2" required></div></div><label class="small">Tambahan TV</label><select id="tv" class="form-select mb-2"><option>Ya</option><option>Tidak</option></select><label class="small">Nominal</label><input id="nominal" type="number" min="0" class="form-control mb-2" required><label class="small">Foto Bukti</label><input id="foto" type="file" accept="image/*" class="form-control mb-3" required><button id="save" class="btn btn-primary w-100">Simpan</button><button type="button" id="cancel" class="btn btn-secondary w-100 mt-2 d-none" onclick="resetForm()">Batal</button></form></div></div><div class="col-lg-8"><div class="card p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>PS</th><th>Penyewa</th><th>TV</th><th>Foto</th><th>Biaya</th><th></th></tr></thead><tbody id="table"></tbody></table></div></div></div></div></main><div class="modal fade" id="m"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center"><img id="mi" class="img-fluid"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';import{getDatabase,ref,onValue,push,set,remove,get,runTransaction}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js';import{getStorage,ref as sr,uploadBytes,getDownloadURL,deleteObject}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js';const cfg={apiKey:'GANTI_API_KEY',authDomain:'GANTI_PROJECT_ID.firebaseapp.com',databaseURL:'https://GANTI_PROJECT_ID-default-rtdb.firebaseio.com',projectId:'GANTI_PROJECT_ID',storageBucket:'GANTI_PROJECT_ID.firebasestorage.app',messagingSenderId:'GANTI_SENDER_ID',appId:'GANTI_APP_ID'},a=initializeApp(cfg),auth=getAuth(a),db=getDatabase(a),st=getStorage(a),$=x=>document.getElementById(x),units=['PS A','PS B','PS C'],emails={master:'master@psrental.app',adan:'adan@psrental.app'};let me,rows=[],off;const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID'),master=()=>me?.role==='master';$('lf').onsubmit=async e=>{e.preventDefault();let name=$('u').value.trim().toLowerCase();if(!emails[name])return alert('Username salah');try{await signInWithEmailAndPassword(auth,emails[name],$('p').value)}catch(e){alert('Username atau PIN salah')}};onAuthStateChanged(auth,async x=>{if(!x){$('login').classList.remove('d-none');$('app').classList.add('d-none');return}let p=(await get(ref(db,'users/'+x.uid))).val();if(!p)return signOut(auth);me={uid:x.uid,...p};$('who').textContent='Login sebagai '+(me.name||me.role);$('login').classList.add('d-none');$('app').classList.remove('d-none');listen();resetForm()});function listen(){if(off)off();off=onValue(ref(db,'transactions'),s=>{rows=Object.entries(s.val()||{}).map(([id,v])=>({id,...v})).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));draw();let ac=0,b=0;rows.forEach(x=>x.unit==='PS B'?b+=+x.nominal:ac+=+x.nominal);$('ac').textContent=rp(ac);$('b').textContent=rp(b);$('all').textContent=rp(ac+b)})}async function q(){let x=(await get(ref(db,'meta/lastUnitIndex'))).val();$('unit').value=units[((Number.isInteger(x)?x:-1)+1)%3]}async function next(){let z=await runTransaction(ref(db,'meta/lastUnitIndex'),x=>((Number.isInteger(x)?x:-1)+1)%3);return units[z.snapshot.val()]}$('f').onsubmit=async e=>{e.preventDefault();let edit=$('id').value,old=rows.find(x=>x.id===edit),file=$('foto').files[0];try{if(edit&&!master())throw Error('Hanya master');let id=edit||push(ref(db,'transactions')).key,url=old?.fotoUrl,path=old?.fotoPath;if(file){if(!file.type.startsWith('image/')||file.size>5242880)throw Error('Foto harus gambar, maksimum 5 MB');path='proofs/'+id+'/'+Date.now()+'_'+file.name.replace(/[^a-z0-9._-]/gi,'_');await uploadBytes(sr(st,path),file);url=await getDownloadURL(sr(st,path))}if(!url)throw Error('Foto wajib');await set(ref(db,'transactions/'+id),{unit:edit?old.unit:await next(),penyewa:$('penyewa').value,tipe:$('tipe').value,durasi:+$('durasi').value,tv:$('tv').value,nominal:+$('nominal').value,fotoUrl:url,fotoPath:path,createdBy:old?.createdBy||me.uid,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()});resetForm()}catch(x){alert(x.message)}};function draw(){$('table').innerHTML=rows.map(x=>`<tr><td>${x.unit}</td><td>${x.penyewa}<br><small>${x.durasi} ${x.tipe}</small></td><td>${x.tv}</td><td><img class="thumb" data-p="${x.fotoUrl}" src="${x.fotoUrl}"></td><td>${rp(x.nominal)}</td><td>${master()?`<button data-e="${x.id}" class="btn btn-sm btn-light">✎</button> <button data-d="${x.id}" class="btn btn-sm btn-light text-danger">🗑</button>`:''}</td></tr>`).join('')}$('table').onclick=async e=>{let t=e.target;if(t.dataset.p){$('mi').src=t.dataset.p;new bootstrap.Modal($('m')).show()}let x=rows.find(z=>z.id==t.dataset.e||z.id==t.dataset.d);if(t.dataset.e&&x){$('id').value=x.id;$('unit').value=x.unit;$('penyewa').value=x.penyewa;$('tipe').value=x.tipe;$('durasi').value=x.durasi;$('tv').value=x.tv;$('nominal').value=x.nominal;$('foto').required=false;$('save').textContent='Update';$('cancel').classList.remove('d-none')}if(t.dataset.d&&x&&confirm('Hapus?')){await remove(ref(db,'transactions/'+x.id));if(x.fotoPath)deleteObject(sr(st,x.fotoPath)).catch(()=>{})}}}function resetForm(){$('f').reset();$('id').value='';$('foto').required=true;$('save').textContent='Simpan';$('cancel').classList.add('d-none');q()}window.logout=()=>signOut(auth);window.resetForm=resetForm;</script></body></html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Rental Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; }
        body { background-color: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .btn-modern { border-radius: 8px; font-weight: 600; }
        .badge-ps { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }
        #loginOverlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .readonly-field { background-color: #e9ecef !important; cursor: not-allowed; font-weight: bold; }
    </style>
</head>
<body>

<!-- Overlay Login -->
<div id="loginOverlay">
    <div class="card glass-card text-white p-4" style="max-width: 400px; width: 90%;">
        <div class="text-center mb-4">
            <i class="bi bi-display display-5 text-primary"></i>
            <h4 class="mt-3 fw-bold">Admin Login</h4>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input type="text" id="loginUser" class="form-control bg-dark text-white border-0" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white-50">PIN</label>
                <input type="password" id="loginPin" class="form-control bg-dark text-white border-0" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-modern py-2">Masuk Panel</button>
        </form>
    </div>
</div>

<!-- Main App -->
<div id="appContent" class="container py-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0">Dashboard Rental PS</h3>
            <p class="text-muted small" id="welcomeText">Selamat datang</p>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-power"></i> Logout</button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="card p-3 bg-primary text-white text-center"><small>Omset (PS A + C)</small><h4 class="fw-bold mb-0" id="omsetAC">Rp 0</h4></div></div>
        <div class="col-md-4"><div class="card p-3 bg-success text-white text-center"><small>Omset (PS B)</small><h4 class="fw-bold mb-0" id="omsetB">Rp 0</h4></div></div>
        <div class="col-md-4"><div class="card p-3 bg-dark text-white text-center"><small>Total Omset</small><h4 class="fw-bold mb-0" id="omsetTotal">Rp 0</h4></div></div>
    </div>

    <div class="row g-4">
        <!-- Form -->
        <div class="col-lg-4">
            <div class="card p-4">
                <h5 class="fw-bold mb-3" id="formTitle">Tambah Transaksi</h5>
                <form id="psForm">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="small fw-bold">Unit PS (Otomatis)</label>
                        <input type="text" id="unitPs" class="form-control readonly-field" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Nomor Penyewa</label>
                        <input type="text" id="noPenyewa" class="form-control" placeholder="08..." required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="small fw-bold">Tipe Sewa</label>
                            <select id="tipeSewa" class="form-select"><option>Jam</option><option>Hari</option></select>
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Durasi</label>
                            <input type="number" id="durasi" class="form-control" placeholder="1" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Tambahan TV</label>
                        <select id="isTv" class="form-select"><option value="Ya">Ya (+TV)</option><option value="Tidak">Tidak</option></select>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Nominal (Rp)</label>
                        <input type="number" id="nominal" class="form-control" placeholder="50000" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-modern" id="btnSubmit">Simpan</button>
                    <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btnCancelEdit" onclick="resetForm()">Batal</button>
                </form>
            </div>
        </div>

        <!-- Tabel -->
        <div class="col-lg-8">
            <div class="card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>PS</th><th>Penyewa</th><th>TV</th><th>Biaya</th><th class="text-end">Aksi</th></tr>
                        </thead>
                        <tbody id="transactionTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const ACCOUNTS = { master: { pin: "171717", role: "Master Admin" }, adan: { pin: "888999", role: "Kasir (Adan)" } };
    let currentUser = JSON.parse(sessionStorage.getItem('ps_session')) || null;
    let transactions = JSON.parse(localStorage.getItem('ps_transactions')) || [];
    let lastUnitIndex = parseInt(localStorage.getItem('ps_last_unit_index')) || -1;
    const units = ['PS A', 'PS B', 'PS C'];

    document.addEventListener('DOMContentLoaded', () => { if(currentUser) showApp(); });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('loginUser').value.toLowerCase();
        const p = document.getElementById('loginPin').value;
        if(ACCOUNTS[u] && ACCOUNTS[u].pin === p) {
            currentUser = { username: u, role: ACCOUNTS[u].role };
            sessionStorage.setItem('ps_session', JSON.stringify(currentUser));
            showApp();
        } else { alert("Data salah!"); }
    });

    function showApp() {
        document.getElementById('loginOverlay').classList.add('d-none');
        document.getElementById('appContent').classList.remove('d-none');
        document.getElementById('welcomeText').innerText = "Logged in as " + currentUser.role;
        updateQueueDisplay();
        renderTable();
        calculateOmset();
    }

    function logout() { sessionStorage.removeItem('ps_session'); location.reload(); }

    function updateQueueDisplay() {
        // Mengisi input dengan unit berikutnya, user tidak bisa mengubahnya
        let nextUnit = units[(lastUnitIndex + 1) % 3];
        document.getElementById('unitPs').value = nextUnit;
    }

    document.getElementById('psForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const data = {
            id: editId ? parseInt(editId) : Date.now(),
            unit: document.getElementById('unitPs').value,
            penyewa: document.getElementById('noPenyewa').value,
            tipe: document.getElementById('tipeSewa').value,
            durasi: document.getElementById('durasi').value,
            tv: document.getElementById('isTv').value,
            nominal: parseInt(document.getElementById('nominal').value)
        };

        if (editId) {
            transactions = transactions.map(t => t.id == editId ? data : t);
        } else {
            transactions.unshift(data);
            lastUnitIndex = units.indexOf(data.unit);
            localStorage.setItem('ps_last_unit_index', lastUnitIndex);
        }
        save();
        resetForm();
    });

    function save() {
        localStorage.setItem('ps_transactions', JSON.stringify(transactions));
        renderTable();
        calculateOmset();
    }

    function calculateOmset() {
        let ac = 0, b = 0;
        transactions.forEach(t => { if(t.unit == 'PS B') b += t.nominal; else ac += t.nominal; });
        document.getElementById('omsetAC').innerText = 'Rp ' + ac.toLocaleString();
        document.getElementById('omsetB').innerText = 'Rp ' + b.toLocaleString();
        document.getElementById('omsetTotal').innerText = 'Rp ' + (ac+b).toLocaleString();
    }

    function renderTable() {
        let tbody = document.getElementById('transactionTable');
        tbody.innerHTML = transactions.map(t => `
            <tr>
                <td><span class="badge bg-secondary badge-ps">${t.unit}</span></td>
                <td>${t.penyewa}<br><small class="text-muted">${t.durasi} ${t.tipe}</small></td>
                <td>${t.tv === 'Ya' ? '<span class="text-success"><i class="bi bi-tv"></i></span>' : '<span class="text-danger"><i class="bi bi-x-circle"></i></span>'}</td>
                <td class="fw-bold">Rp ${t.nominal.toLocaleString()}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-light" onclick="edit(${t.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-light text-danger" onclick="del(${t.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function edit(id) {
        let t = transactions.find(x => x.id == id);
        document.getElementById('editId').value = t.id;
        document.getElementById('unitPs').value = t.unit; // Bisa diisi saat edit
        document.getElementById('noPenyewa').value = t.penyewa;
        document.getElementById('tipeSewa').value = t.tipe;
        document.getElementById('durasi').value = t.durasi;
        document.getElementById('isTv').value = t.tv;
        document.getElementById('nominal').value = t.nominal;
        document.getElementById('btnSubmit').innerText = "Update";
        document.getElementById('btnCancelEdit').classList.remove('d-none');
    }

    function del(id) { if(confirm('Hapus?')) { transactions = transactions.filter(x => x.id != id); save(); } }
    function resetForm() { document.getElementById('psForm').reset(); document.getElementById('editId').value = ''; document.getElementById('btnSubmit').innerText = "Simpan"; document.getElementById('btnCancelEdit').classList.add('d-none'); updateQueueDisplay(); }
</script>
</body>
</html>

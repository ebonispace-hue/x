<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Sewa PS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .img-thumbnail-custom {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="mb-4 text-center fw-bold">Panel Admin Rental PlayStation</h2>

    <!-- Ringkasan Omset -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Omset Combined (PS A & PS C)</h6>
                    <h3 class="fw-bold mb-0" id="omsetAC">Rp 0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Omset Separate (PS B)</h6>
                    <h3 class="fw-bold mb-0" id="omsetB">Rp 0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-dark text-white shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Total Omset Keseluruhan</h6>
                    <h3 class="fw-bold mb-0" id="omsetTotal">Rp 0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Form Transaksi / Edit -->
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                    <span id="formTitle">Tambah Transaksi Baru</span>
                    <span class="badge bg-info text-dark" id="nextQueueBadge">Giliran: PS A</span>
                </div>
                <div class="card-body">
                    <form id="psForm">
                        <input type="hidden" id="editId">
                        
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Unit PS</label>
                            <select id="unitPs" class="form-select" required>
                                <option value="PS A">PS A</option>
                                <option value="PS B">PS B</option>
                                <option value="PS C">PS C</option>
                            </select>
                            <small class="text-muted">*Otomatis mengikuti urutan A -> B -> C</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nomor Penyewa (WhatsApp/HP)</label>
                            <input type="text" id="noPenyewa" class="form-control" placeholder="08123456789" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipe Sewa</label>
                                <select id="tipeSewa" class="form-select" required>
                                    <option value="Jam">Jam</option>
                                    <option value="Hari">Hari</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Durasi</label>
                                <input type="number" id="durasi" class="form-control" placeholder="1" min="1" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nominal / Biaya (Rp)</label>
                            <input type="number" id="nominal" class="form-control" placeholder="10000" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Keterangan</label>
                            <textarea id="keterangan" class="form-control" rows="2" placeholder="Catatan tambahan..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Foto Penyewa</label>
                            <input type="file" id="fotoPenyewa" class="form-control" accept="image/*">
                            <div id="imagePreviewContainer" class="mt-2 d-none">
                                <img id="imagePreview" src="" class="img-thumbnail" style="max-height: 100px;">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" id="btnSubmit">Simpan Transaksi</button>
                            <button type="button" class="btn btn-secondary d-none" id="btnCancelEdit" onclick="resetForm()">Batal Edit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabel Riwayat Transaksi -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">
                    Riwayat Transaksi (Master Admin Panel)
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Foto</th>
                                    <th>PS</th>
                                    <th>Penyewa</th>
                                    <th>Durasi</th>
                                    <th>Nominal</th>
                                    <th>Keterangan</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="transactionTable">
                                <!-- Data dimasukkan via Javascript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Zoom Foto -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center p-0">
                <img id="modalImage" src="" class="img-fluid rounded">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let transactions = JSON.parse(localStorage.getItem('ps_transactions')) || [];
    let lastUnitIndex = parseInt(localStorage.getItem('ps_last_unit_index')) || -1;
    const units = ['PS A', 'PS B', 'PS C'];

    document.addEventListener('DOMContentLoaded', () => {
        updateQueueDisplay();
        renderTable();
        calculateOmset();
    });

    // Otomasi Alur A -> B -> C -> A
    function getNextUnit() {
        let nextIndex = (lastUnitIndex + 1) % units.length;
        return units[nextIndex];
    }

    function updateQueueDisplay() {
        const nextUnit = getNextUnit();
        document.getElementById('nextQueueBadge').innerText = `Giliran: ${nextUnit}`;
        if (!document.getElementById('editId').value) {
            document.getElementById('unitPs').value = nextUnit;
        }
    }

    // Convert foto ke Base64
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // Form Submit (Tambah & Edit)
    document.getElementById('psForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const editId = document.getElementById('editId').value;
        const selectedUnit = document.getElementById('unitPs').value;
        const noPenyewa = document.getElementById('noPenyewa').value;
        const tipeSewa = document.getElementById('tipeSewa').value;
        const durasi = document.getElementById('durasi').value;
        const nominal = parseFloat(document.getElementById('nominal').value);
        const keterangan = document.getElementById('keterangan').value;
        const fileInput = document.getElementById('fotoPenyewa');

        let fotoBase64 = '';
        if (fileInput.files[0]) {
            fotoBase64 = await getBase64(fileInput.files[0]);
        } else if (editId) {
            const existing = transactions.find(t => t.id == editId);
            fotoBase64 = existing ? existing.foto : '';
        }

        if (editId) {
            // Mode Edit Master
            transactions = transactions.map(item => {
                if (item.id == editId) {
                    return { ...item, unit: selectedUnit, noPenyewa, tipeSewa, durasi, nominal, keterangan, foto: fotoBase64 };
                }
                return item;
            });
        } else {
            // Transaksi Baru
            const newTransaction = {
                id: Date.now(),
                unit: selectedUnit,
                noPenyewa,
                tipeSewa,
                durasi,
                nominal,
                keterangan,
                foto: fotoBase64,
                tanggal: new Date().toLocaleString('id-ID')
            };
            transactions.unshift(newTransaction);

            // Update urutan otomatis
            lastUnitIndex = units.indexOf(selectedUnit);
            localStorage.setItem('ps_last_unit_index', lastUnitIndex);
        }

        saveAndRefresh();
        resetForm();
    });

    function saveAndRefresh() {
        localStorage.setItem('ps_transactions', JSON.stringify(transactions));
        renderTable();
        calculateOmset();
        updateQueueDisplay();
    }

    function calculateOmset() {
        let omsetAC = 0;
        let omsetB = 0;

        transactions.forEach(t => {
            if (t.unit === 'PS A' || t.unit === 'PS C') {
                omsetAC += t.nominal;
            } else if (t.unit === 'PS B') {
                omsetB += t.nominal;
            }
        });

        document.getElementById('omsetAC').innerText = `Rp ${omsetAC.toLocaleString('id-ID')}`;
        document.getElementById('omsetB').innerText = `Rp ${omsetB.toLocaleString('id-ID')}`;
        document.getElementById('omsetTotal').innerText = `Rp ${(omsetAC + omsetB).toLocaleString('id-ID')}`;
    }

    function renderTable() {
        const tbody = document.getElementById('transactionTable');
        tbody.innerHTML = '';

        if (transactions.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">Belum ada transaksi</td></tr>`;
            return;
        }

        transactions.forEach(t => {
            const tr = document.createElement('tr');
            const imgHtml = t.foto 
                ? `<img src="${t.foto}" class="img-thumbnail-custom" onclick="showImageModal('${t.foto}')">` 
                : `<span class="text-muted">-</span>`;

            tr.innerHTML = `
                <td>${imgHtml}</td>
                <td><span class="badge bg-secondary">${t.unit}</span></td>
                <td>${t.noPenyewa}</td>
                <td>${t.durasi} ${t.tipeSewa}</td>
                <td class="fw-bold">Rp ${t.nominal.toLocaleString('id-ID')}</td>
                <td><small>${t.keterangan || '-'}</small></td>
                <td>
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editTransaction(${t.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${t.id})"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editTransaction(id) {
        const item = transactions.find(t => t.id == id);
        if (!item) return;

        document.getElementById('editId').value = item.id;
        document.getElementById('unitPs').value = item.unit;
        document.getElementById('noPenyewa').value = item.noPenyewa;
        document.getElementById('tipeSewa').value = item.tipeSewa;
        document.getElementById('durasi').value = item.durasi;
        document.getElementById('nominal').value = item.nominal;
        document.getElementById('keterangan').value = item.keterangan;

        document.getElementById('formTitle').innerText = 'Edit Transaksi (Master Admin)';
        document.getElementById('btnSubmit').innerText = 'Update Transaksi';
        document.getElementById('btnCancelEdit').classList.remove('d-none');

        if (item.foto) {
            document.getElementById('imagePreview').src = item.foto;
            document.getElementById('imagePreviewContainer').classList.remove('d-none');
        } else {
            document.getElementById('imagePreviewContainer').classList.add('d-none');
        }
    }

    function deleteTransaction(id) {
        if (confirm('Hapus transaksi ini?')) {
            transactions = transactions.filter(t => t.id != id);
            saveAndRefresh();
        }
    }

    function resetForm() {
        document.getElementById('psForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('formTitle').innerText = 'Tambah Transaksi Baru';
        document.getElementById('btnSubmit').innerText = 'Simpan Transaksi';
        document.getElementById('btnCancelEdit').classList.add('d-none');
        document.getElementById('imagePreviewContainer').classList.add('d-none');
        updateQueueDisplay();
    }

    function showImageModal(src) {
        document.getElementById('modalImage').src = src;
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    }
</script>
</body>
</html>

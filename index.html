<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS Rental Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root{--bg:#f8fafc}body{background:var(--bg);font-family:Segoe UI,system-ui,sans-serif}.card{border:0;border-radius:16px;box-shadow:0 4px 6px -1px #0001}.btn-modern{border-radius:8px;font-weight:600}.badge-ps{padding:6px 12px;border-radius:20px;font-size:.85rem}#loginOverlay{position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center}.glass-card{background:#ffffff0d;backdrop-filter:blur(10px);border:1px solid #ffffff1a}.readonly-field{background:#e9ecef!important;cursor:not-allowed;font-weight:bold}.thumb-img{width:45px;height:45px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #dee2e6}
  </style>
</head>
<body>
<div id="loginOverlay"><div class="card glass-card text-white p-4" style="max-width:400px;width:90%"><div class="text-center mb-4"><i class="bi bi-display display-5 text-primary"></i><h4 class="mt-3 fw-bold">Admin Login</h4></div><form id="loginForm"><div class="mb-3"><label class="form-label text-white-50">Email</label><input type="email" id="loginUser" class="form-control bg-dark text-white border-0" required></div><div class="mb-3"><label class="form-label text-white-50">Password</label><input type="password" id="loginPin" class="form-control bg-dark text-white border-0" required></div><button class="btn btn-primary w-100 btn-modern py-2">Masuk Panel</button></form></div></div>
<div id="appContent" class="container py-5 d-none"><div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold m-0">Dashboard Rental PS</h3><p class="text-muted small" id="welcomeText"></p></div><button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-power"></i> Logout</button></div><div class="row g-3 mb-4"><div class="col-md-4"><div class="card p-3 bg-primary text-white text-center"><small>Omset (PS A + C)</small><h4 class="fw-bold mb-0" id="omsetAC">Rp 0</h4></div></div><div class="col-md-4"><div class="card p-3 bg-success text-white text-center"><small>Omset (PS B)</small><h4 class="fw-bold mb-0" id="omsetB">Rp 0</h4></div></div><div class="col-md-4"><div class="card p-3 bg-dark text-white text-center"><small>Total Omset</small><h4 class="fw-bold mb-0" id="omsetTotal">Rp 0</h4></div></div></div><div class="row g-4"><div class="col-lg-4"><div class="card p-4"><h5 class="fw-bold mb-3">Tambah Transaksi</h5><form id="psForm"><input type="hidden" id="editId"><div class="mb-3"><label class="small fw-bold">Unit PS (Otomatis)</label><input id="unitPs" class="form-control readonly-field" readonly></div><div class="mb-3"><label class="small fw-bold">Nomor Penyewa</label><input id="noPenyewa" class="form-control" placeholder="08..." required></div><div class="row mb-3"><div class="col-6"><label class="small fw-bold">Tipe Sewa</label><select id="tipeSewa" class="form-select"><option>Jam</option><option>Hari</option></select></div><div class="col-6"><label class="small fw-bold">Durasi</label><input type="number" id="durasi" min="1" class="form-control" placeholder="1" required></div></div><div class="mb-3"><label class="small fw-bold">Tambahan TV</label><select id="isTv" class="form-select"><option value="Ya">Ya (+TV)</option><option value="Tidak">Tidak</option></select></div><div class="mb-3"><label class="small fw-bold">Nominal (Rp)</label><input type="number" id="nominal" min="0" class="form-control" placeholder="50000" required></div><div class="mb-3"><label class="small fw-bold">Upload Foto Bukti <span class="text-danger">*</span></label><input type="file" id="fotoBukti" class="form-control" accept="image/*" required></div><button class="btn btn-primary w-100 btn-modern" id="btnSubmit">Simpan</button><button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btnCancelEdit" onclick="resetForm()">Batal</button></form></div></div><div class="col-lg-8"><div class="card p-0 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>PS</th><th>Penyewa</th><th>TV</th><th>Foto</th><th>Biaya</th><th class="text-end">Aksi</th></tr></thead><tbody id="transactionTable"></tbody></table></div></div></div></div></div>
<div class="modal fade" id="photoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title fw-bold">Bukti Transaksi</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center p-2"><img id="modalImg" class="img-fluid rounded" style="max-height:80vh"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';import{getDatabase,ref,onValue,push,set,remove,get,runTransaction}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js';import{getStorage,ref as sref,uploadBytes,getDownloadURL,deleteObject}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js';
const firebaseConfig={apiKey:'GANTI_API_KEY',authDomain:'GANTI_PROJECT_ID.firebaseapp.com',databaseURL:'https://GANTI_PROJECT_ID-default-rtdb.firebaseio.com',projectId:'GANTI_PROJECT_ID',storageBucket:'GANTI_PROJECT_ID.firebasestorage.app',messagingSenderId:'GANTI_SENDER_ID',appId:'GANTI_APP_ID'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),storage=getStorage(app),units=['PS A','PS B','PS C'];let user=null,rows=[],off=null;const $=id=>document.getElementById(id),rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),master=()=>user?.role==='master',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('loginUser').value.trim(),$('loginPin').value)}catch(e){alert('Login gagal. Periksa email dan password.')}};
onAuthStateChanged(auth,async a=>{if(!a){showLogin();return}try{let p=(await get(ref(db,'users/'+a.uid))).val();if(!p||!['master','cashier'].includes(p.role))throw Error('Akun belum diberi role oleh admin.');user={uid:a.uid,...p};$('loginOverlay').classList.add('d-none');$('appContent').classList.remove('d-none');$('welcomeText').textContent='Logged in as '+(user.name||user.role);listen();resetForm()}catch(e){alert(e.message);signOut(auth)}});
function showLogin(){user=null;$('loginOverlay').classList.remove('d-none');$('appContent').classList.add('d-none');if(off)off()}
function listen(){if(off)off();off=onValue(ref(db,'transactions'),s=>{rows=Object.entries(s.val()||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();sum()},e=>alert('Database gagal dibaca: '+e.message))}
async function queue(){let s=await get(ref(db,'meta/lastUnitIndex')),i=Number.isInteger(s.val())?s.val():-1;$('unitPs').value=units[(i+1)%3]}
async function nextUnit(){let r=await runTransaction(ref(db,'meta/lastUnitIndex'),v=>(Number.isInteger(v)?v:-1+3+1)%3);if(!r.committed)throw Error('Antrean PS gagal dibuat.');return units[r.snapshot.val()]}
$('psForm').onsubmit=async e=>{e.preventDefault();let edit=$('editId').value,file=$('fotoBukti').files[0],btn=$('btnSubmit');btn.disabled=true;btn.textContent='Menyimpan...';try{if(edit&&!master())throw Error('Hanya Master dapat mengedit.');let old=edit?rows.find(x=>x.id===edit):null,id=edit||push(ref(db,'transactions')).key,url=old?.fotoUrl||'',path=old?.fotoPath||'';if(file){if(!file.type.startsWith('image/'))throw Error('Foto harus gambar.');if(file.size>5242880)throw Error('Foto maksimum 5 MB.');path='proofs/'+id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');await uploadBytes(sref(storage,path),file,{contentType:file.type});url=await getDownloadURL(sref(storage,path));if(old?.fotoPath&&old.fotoPath!==path)deleteObject(sref(storage,old.fotoPath)).catch(()=>{})}if(!url)throw Error('Foto bukti wajib diunggah.');let data={unit:edit?old.unit:await nextUnit(),penyewa:$('noPenyewa').value.trim(),tipe:$('tipeSewa').value,durasi:+$('durasi').value,tv:$('isTv').value,nominal:+$('nominal').value,fotoUrl:url,fotoPath:path,createdBy:old?.createdBy||user.uid,updatedBy:user.uid,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};if(!data.penyewa||data.durasi<1||data.nominal<0)throw Error('Data transaksi belum valid.');await set(ref(db,'transactions/'+id),data);resetForm()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent=$('editId').value?'Update':'Simpan'}};
function sum(){let ac=0,b=0;rows.forEach(x=>x.unit==='PS B'?b+=+x.nominal||0:ac+=+x.nominal||0);$('omsetAC').textContent=rp(ac);$('omsetB').textContent=rp(b);$('omsetTotal').textContent=rp(ac+b)}
function render(){$('transactionTable').innerHTML=rows.map(x=>`<tr><td><span class="badge bg-secondary badge-ps">${esc(x.unit)}</span></td><td>${esc(x.penyewa)}<br><small class="text-muted">${esc(x.durasi)} ${esc(x.tipe)}</small></td><td>${x.tv==='Ya'?'<span class="text-success"><i class="bi bi-tv"></i></span>':'<span class="text-danger"><i class="bi bi-x-circle"></i></span>'}</td><td>${x.fotoUrl?`<img src="${esc(x.fotoUrl)}" class="thumb-img" data-a="photo" data-url="${esc(x.fotoUrl)}">`:'-'}</td><td class="fw-bold">${rp(x.nominal)}</td><td class="text-end">${master()?`<button class="btn btn-sm btn-light" data-a="edit" data-id="${x.id}"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light text-danger" data-a="del" data-id="${x.id}"><i class="bi bi-trash"></i></button>`:'<span class="text-muted small">No Access</span>'}</td></tr>`).join('')}
$('transactionTable').onclick=async e=>{let t=e.target.closest('[data-a]');if(!t)return;if(t.datase

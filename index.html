<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Rental PS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#4f46e5;--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--danger:#dc2626;--ok:#16a34a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.card{background:var(--card);border-radius:16px;box-shadow:0 6px 20px #16213a14;padding:22px}.hide{display:none}.login{min-height:100vh;display:grid;place-items:center;background:#0f172a;padding:20px}.login .card{width:min(420px,100%);background:#17233a;color:#fff}.brand{font-weight:800;font-size:21px}.muted{color:var(--muted)}.login .muted{color:#c7d2e3}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{border-radius:14px;padding:18px;color:#fff}.stat small{opacity:.85}.stat strong{display:block;font-size:24px;margin-top:6px}.a{background:var(--primary)}.b{background:var(--ok)}.c{background:#1e293b}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #d5dce8;border-radius:9px;padding:11px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.readonly{background:#eef2f7;font-weight:bold}button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#e9edf5;color:#25324a}.danger{color:var(--danger);background:#fff0f1}.outline{border:1px solid #d5dce8;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.status{min-height:20px;margin:13px 0 0;color:var(--muted)}.err{color:var(--danger)}.ok{color:var(--ok)}.tablewrap{overflow:auto;padding:0}.tablehead{padding:20px 22px 10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 16px;border-top:1px solid #e9edf4}th{color:var(--muted);font-size:12px}td strong{display:block}.badge{display:inline-block;background:#e8ebff;color:#3931a5;border-radius:99px;padding:5px 9px;font-size:12px}.thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:9}.modalbox{background:#fff;border-radius:14px;max-width:700px;width:100%;padding:15px}.modalbox img{width:100%;max-height:75vh;object-fit:contain}.modaltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}@media(max-width:800px){.stats,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:22px;margin:0}}
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <div class="card">
      <div class="brand">🎮 Dashboard Rental PS</div>
      <p class="muted">Masuk menggunakan akun Supabase Anda.</p>
      <form id="loginForm">
        <label>Email</label><input id="email" type="email" placeholder="admin@contoh.com" required>
        <label>Password</label><input id="password" type="password" minlength="6" required>
        <div class="actions"><button class="primary" type="submit">Masuk Panel</button></div>
        <p id="loginStatus" class="status"></p>
      </form>
    </div>
  </section>

  <main id="appView" class="wrap hide">
    <header class="top">
      <div><div class="brand">🎮 Dashboard Rental PS</div><p id="welcome" class="muted"></p></div>
      <button id="logout" class="outline">Logout</button>
    </header>
    <section class="stats">
      <div class="stat a"><small>Omset PS A + C</small><strong id="omsetAC">Rp 0</strong></div>
      <div class="stat b"><small>Omset PS B</small><strong id="omsetB">Rp 0</strong></div>
      <div class="stat c"><small>Total Omset</small><strong id="omsetTotal">Rp 0</strong></div>
    </section>
    <section class="grid">
      <div class="card">
        <h2 id="formTitle" style="margin-top:0;font-size:18px">Tambah Transaksi</h2>
        <form id="transactionForm">
          <input id="editId" type="hidden">
          <label>Unit PS</label><input id="unit" class="readonly" readonly>
          <label>Nomor Penyewa</label><input id="penyewa" placeholder="08..." required>
          <div class="row"><div><label>Tipe Sewa</label><select id="tipe"><option>Jam</option><option>Hari</option></select></div><div><label>Durasi</label><input id="durasi" type="number" min="1" value="1" required></div></div>
          <label>Tambahan TV</label><select id="tv"><option value="Ya">Ya (+TV)</option><option value="Tidak">Tidak</option></select>
          <label>Nominal (Rp)</label><input id="nominal" type="number" min="0" placeholder="50000" required>
          <label>Foto bukti <span id="photoRequired">*</span></label><input id="foto" type="file" accept="image/jpeg,image/png,image/webp" required>
          <div class="actions"><button id="saveButton" class="primary" type="submit">Simpan</button><button id="cancelEdit" class="secondary hide" type="button">Batal</button></div>
          <p id="formStatus" class="status"></p>
        </form>
      </div>
      <div class="card tablewrap">
        <div class="tablehead"><h2 style="margin:0;font-size:18px">Transaksi tersimpan</h2></div>
        <table><thead><tr><th>PS</th><th>Penyewa</th><th>TV</th><th>Foto</th><th>Biaya</th><th>Aksi</th></tr></thead><tbody id="transactionTable"></tbody></table>
      </div>
    </section>
  </main>

  <div id="photoModal" class="modal hide"><div class="modalbox"><div class="modaltop"><strong>Bukti Transaksi</strong><button id="closeModal" class="secondary">Tutup</button></div><img id="modalImg" alt="Bukti transaksi"></div></div>

<script>
  // GANTI dua nilai ini dengan Project URL dan anon public key dari Supabase: Settings > API.
  const SUPABASE_URL = 'PASTE_SUPABASE_PROJECT_URL_DI_SINI';
  const SUPABASE_ANON_KEY = 'PASTE_SUPABASE_ANON_KEY_DI_SINI';
  const BUCKET = 'bukti-transaksi';
  const units = ['PS A','PS B','PS C'];

  let sb = null, currentUser = null, profile = null, transactions = [], photoUrls = {};
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const rupiah = value => 'Rp ' + Number(value || 0).toLocaleString('id-ID');

  function setupClient(){
    if(SUPABASE_URL.includes('PASTE_') || SUPABASE_ANON_KEY.includes('PASTE_')){
      $('loginStatus').className='status err';
      $('loginStatus').textContent='Masukkan Supabase Project URL dan anon public key pada bagian konfigurasi file ini.';
      return false;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }

  async function boot(){
    if(!setupClient()) return;
    const result = await sb.auth.getSession();
    if(result.data.session) await openApp(result.data.session.user);
  }

  async function openApp(user){
    currentUser = user;
    const profileResult = await sb.from('profiles').select('*').eq('id', user.id).single();
    if(profileResult.error){
      await sb.auth.signOut();
      $('loginStatus').className='status err';
      $('loginStatus').textContent='Akun belum memiliki profil/role. Tambahkan akun ke tabel profiles sesuai petunjuk SQL.';
      return;
    }
    profile = profileResult.data;
    $('loginView').classList.add('hide');
    $('appView').classList.remove('hide');
    $('welcome').textContent = profile.full_name + ' — ' + (profile.role === 'master' ? 'Master Admin' : 'Kasir');
    await loadTransactions();
    resetForm();
  }

  async function loadTransactions(){
    const result = await sb.from('transactions').select('*').order('created_at',{ascending:false});
    if(result.error){ showFormError(result.error.message); return; }
    transactions = result.data || [];
    photoUrls = {};
    await Promise.all(transactions.map(async t => {
      const signed = await sb.storage.from(BUCKET).createSignedUrl(t.foto_path, 3600);
      if(!signed.error) photoUrls[t.id] = signed.data.signedUrl;
    }));
    render();
  }

  function nextUnit(){
    if(!transactions.length) return units[0];
    const last = transactions[0].unit;
    return units[(units.indexOf(last)+1) % units.length];
  }

  function render(){
    let ac=0, b=0;
    transactions.forEach(t => { if(t.unit==='PS B') b+=Number(t.nominal); else ac+=Number(t.nominal); });
    $('omsetAC').textContent=rupiah(ac); $('omsetB').textContent=rupiah(b); $('omsetTotal').textContent=rupiah(ac+b);
    const master = profile.role === 'master';
    $('transactionTable').innerHTML = transactions.length ? transactions.map(t => `
      <tr><td><span class="badge">${esc(t.unit)}</span></td><td><strong>${esc(t.penyewa)}</strong><small class="muted">${esc(t.durasi)} ${esc(t.tipe)}</small></td><td>${t.tv==='Ya'?'Ya':'Tidak'}</td><td>${photoUrls[t.id] ? `<img class="thumb" data-photo="${t.id}" src="${photoUrls[t.id]}" alt="Bukti">` : '-'}</td><td><strong>${rupiah(t.nominal)}</strong></td><td>${master ? `<button class="secondary" data-edit="${t.id}">Edit</button> <button class="danger" data-delete="${t.id}">Hapus</button>` : '<small class="muted">Hanya lihat</small>'}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">Belum ada transaksi.</td></tr>';
    document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>showPhoto(b.dataset.photo));
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
    document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeTransaction(b.dataset.delete));
  }

  function resetForm(){
    $('transactionForm').reset(); $('editId').value=''; $('unit').value=nextUnit(); $('durasi').value=1;
    $('foto').required=true; $('photoRequired').classList.remove('hide'); $('formTitle').textContent='Tambah Transaksi'; $('saveButton').textContent='Simpan'; $('cancelEdit').classList.add('hide'); $(

<div class="form-group full-width">
  <label for="foto">Foto Penyewa</label>

  <div class="file-upload">
    <!-- Tanpa capture="environment" agar bisa pilih dari galeri -->
    <input type="file" id="foto" accept="image/*">

    <label for="foto" class="file-label">
      <i class="fas fa-images"></i>
      <span id="fileName">Pilih Foto dari Galeri / Kamera</span>
    </label>

    <div id="previewContainer" class="preview-container hidden">
      <img id="fotoPreview" alt="Preview Foto Penyewa">

      <button type="button" id="removeFoto" class="btn-remove" title="Hapus foto">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>
